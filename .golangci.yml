version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocyclo:
      min-complexity: 25
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: context-as-argument
    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - contextcheck
      - path: 'internal/(config|dlq)/.*\.go'
        linters:
          - gosec
        text: G304
      - path: 'pkg/bridge/retry\.go'
        linters:
          - gosec
        text: G404

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
