name: Go

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files
        run: go mod tidy -diff

      - name: Reject committed binaries
        run: |
          if git ls-files --error-unmatch gostreambridge >/dev/null 2>&1; then
            echo "::error::gostreambridge is a build artifact and must not be committed"
            exit 1
          fi

      - name: Build
        run: go build -trimpath ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

      - name: Test
        run: go test -race -count=1 ./...

      - name: Chaos contracts
        run: go test -race -count=1 -tags chaos ./test/chaos

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start dependencies
        run: docker compose -f docker-compose.test.yml --profile core --profile sqlserver up -d --wait --wait-timeout 600

      - name: Integration tests
        env:
          SQLSERVER_HOST: 127.0.0.1
        run: make test-integration

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.test.yml --profile core --profile sqlserver logs --no-color

      - name: Stop dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml --profile core --profile sqlserver down -v
